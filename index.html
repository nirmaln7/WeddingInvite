<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K & A</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=pin_drop" />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Kaushan+Script&family=Limelight&family=Overlock+SC&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">  <script
      src="https://kit.fontawesome.com/bdd89edb33.js"
      crossorigin="anonymous"
    ></script>
    <style>
      /* Reset & Base */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Lato", sans-serif;
        background-color: #f9f9f9; /* Off-white */
        padding: 2rem;
      }

      h2, h3 {
        text-align: center;
        font-size: 2rem;
        color: #333;
      }

      /* Layout */
      .cards-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 2rem;
      }

      .card {
        background-color: transparent;
        width: 300px;
        height: 400px;
        perspective: 1000px;
      }

      .card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.8s;
        transform-style: preserve-3d;
      }

      .card:hover .card-inner {
        transform: rotateY(180deg);
      }

      .card-front,
      .card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        padding: 2rem;
        backface-visibility: hidden;
      }

      .card-front {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #333;
        background-color: rgba(255, 255, 255, 0.3); /* white with 80% opacity */
      }

      .card-front i {
        font-size: 3rem;
        margin-bottom: 1rem;
        color: #2a9d8f;
      }

      .card-front h3 {
        font-size: 1.5rem;
        margin-bottom: 1rem;
      }

      .card-front ul {
        list-style: none;
        text-align: left;
      }

      .card-front li {
        margin-bottom: 0.5rem;
      }
      .tangerine-regular {
      font-family: "Tangerine", cursive;
      font-weight: 400;
      font-style: normal;
      font-size: 40px;
    }

    .tangerine-bold {
      font-family: "Tangerine", cursive;
      font-weight: 700;
      font-size: 60px;
      font-style: normal;
    }
    .kaushan-script-regular {
      font-family: "Kaushan Script", cursive;
      font-weight: 200;
      font-style: normal;
      font-size: 1.7rem !important;
    }


      .card-back {
        transform: rotateY(180deg);
        background-color: #2a9d8f;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .card-back h4 {
        font-size: 1.8rem;
        margin-bottom: 1rem;
      }

      .card-back p {
        font-size: 1.2rem;
      }
      .head-two {
        padding-bottom: 20px;
      }
      .delius-regular {
        font-family:  "Overlock SC", sans-serif;
        font-weight: 700;
        font-style: normal;
        font-size: 60px !important;
      }
    .cardone {
      background-image: url("images/IMG-20250419-WA0000.jpg");
      background-size: cover;       /* makes the image cover the full area */
      background-position: center;  /* centers the image */
      background-repeat: no-repeat; /* prevents tiling */
      border-radius: 10px;
    }
    .cardtwo {
      background-image: url("images/IMG-20250419-WA0001.jpg");
      background-size: cover;       /* makes the image cover the full area */
      background-position: center;  /* centers the image */
      background-repeat: no-repeat; /* prevents tiling */
      border-radius: 10px;
    }
    .cardthree {
      background-image: url("images/IMG-20250419-WA0002.jpg");
      background-size: cover;       /* makes the image cover the full area */
      background-position: center;  /* centers the image */
      background-repeat: no-repeat; /* prevents tiling */
      border-radius: 10px;
    }
    .limelight-regular {
    font-family: "Limelight", sans-serif;
    font-weight: 400;
    color: #fff !important;
    font-style: normal;
  }
  .dm-serif-text-regular {
  font-family: "DM Serif Text", serif;
  font-weight: 400;
  font-size: 2.5rem;
  color: #fff !important;
  font-style: normal;
}

.dm-serif-text-regular-italic {
  font-family: "DM Serif Text", serif;
  font-weight: 400;
  color: #fff !important;
  font-style: italic;
}
.loca {
  font-size: 75px !important;
  color: #fff;
}

        /* Responsive */
      @media (max-width: 768px) {
        .card {
          width: 90%;
        }
      }
    </style>
  </head>
  <body>
    <h2 class="tangerine-bold">Keerthana & Akhil</h2>
    <h3 class="tangerine-regular head-two">invites you to</h3>
    <div class="cards-container">
      <!-- Card 1 -->
      <div class="card">
        <div class="card-inner cardone">
          <div class="card-front">
            <i class="fas fa-paper-plane"></i>
            <h3 class="delius-regular">What!</h3>
          </div>
          <div class="card-back">
            <p class="kaushan-script-regular">
              Together with our family, we invite you to celebrate our wedding.
              Kindly bless us with your presence on our special day.
            </p>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="card">
        <div class="card-inner cardtwo">
          <div class="card-front">
            <i class="fas fa-plane"></i>
            <h3 class="delius-regular">When!</h3>
          </div>
          <div class="card-back">
            <h2 class="limelight-regular">Sunday<h2>
            <h2 class="limelight-regular">18 May 2025<h2>
            <h3 class="limelight-regular">11AM Onwards<h3>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="card">
        <div class="card-inner cardthree">
          <div class="card-front">
            <i class="fas fa-rocket"></i>
            <h3 class="delius-regular">Where!</h3>

          </div>
          <div class="card-back">
            <h2 class="dm-serif-text-regular">Shoba Auditorium</h2>
            <h3 class="dm-serif-text-regular-italic ">Thiruvankulam</h3>
           
              <a href="https://maps.app.goo.gl/ybdpGcadeYonfeTb7"> <span class="material-symbols-outlined loca">pin_drop
              </span></a>

            <i class="fa-solid fa-location-dot"></i>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
